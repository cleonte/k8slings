topic = "troubleshooting"
mode = "fix"
hint = """
The Job gave up, and its logs say why. What can you change in a Job that already ran, and what has to be made again?"""
docs = "https://kubernetes.io/docs/concepts/workloads/controllers/job/#pod-backoff-failure-policy"

