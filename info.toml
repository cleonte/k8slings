name = "jobs2"
path = "exercises/jobs/jobs2"
topic = "jobs"
mode = "manifest"
hint = """
A cron schedule has five fields. How would you write 'every fifth minute' in the first one?"""
docs = "https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/#cron-schedule-syntax"

[[exercises]]
name = "jobs3"
path = "exercises/jobs/jobs3"
topic = "jobs"
mode = "manifest"
hint = """
Which concurrencyPolicy skips a run while the previous one is still going? And how many finished Jobs do you really need to keep?"""
