name = "networkpolicies3"
path = "exercises/networkpolicies/networkpolicies3"
topic = "networkpolicies"
mode = "manifest"
hint = """
A policy that selects Pods denies what it does not list. What does a rule with nothing in it list?"""
docs = "https://kubernetes.io/docs/concepts/services-networking/network-policies/#default-deny-all-ingress-and-all-egress-traffic"

[[exercises]]
