[[exercises]]
name = "pods1"
path = "exercises/pods/pods1"
topic = "pods"
mode = "manifest"
hint = """
Read the error: Kubernetes lists a field it does not know. Compare it with the Pod spec."""
docs = "https://kubernetes.io/docs/concepts/workloads/pods/"

[[exercises]]
name = "pods2"
path = "exercises/pods/pods2"
topic = "pods"
mode = "manifest"
hint = """
command is a list of strings, one per word, like ["ls", "-l"]."""
docs = "https://kubernetes.io/docs/tasks/inject-data-application/define-command-argument-container/"

[[exercises]]
name = "pods3"
path = "exercises/pods/pods3"
topic = "pods"
mode = "manifest"
hint = """
Each entry starts with '- name:' and has a 'value:' under it."""
docs = "https://kubernetes.io/docs/tasks/inject-data-application/define-environment-variable-container/"

[[exercises]]
name = "pods4"
path = "exercises/pods/pods4"
topic = "pods"
mode = "manifest"
hint = """
Which restartPolicy values leave a container that exited with code 0 alone?"""
docs = "https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/#restart-policy"

[[exercises]]
name = "pods5"
path = "exercises/pods/pods5"
topic = "pods"
mode = "manifest"
hint = """
Container names must differ. The second one is the sidecar."""
docs = "https://kubernetes.io/docs/concepts/workloads/pods/#pods-that-run-multiple-containers"

[[exercises]]
name = "pods6"
path = "exercises/pods/pods6"
topic = "pods"
mode = "cluster"
timeout = "60s"
hint = """
There are two mistakes. A mount refers to a volume by name; and nginx serves the files in /usr/share/nginx/html."""
docs = "https://kubernetes.io/docs/concepts/workloads/pods/init-containers/"

[[exercises]]
name = "labels1"
path = "exercises/labels/labels1"
topic = "labels"
mode = "manifest"
hint = """
Compare the selector with the labels of the Pod template, key by key."""
docs = "https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#selector"

[[exercises]]
name = "labels2"
path = "exercises/labels/labels2"
topic = "labels"
mode = "manifest"
hint = """
A Service finds Pods by their labels. Which labels do the Pods have?"""
docs = "https://kubernetes.io/docs/concepts/services-networking/service/"

[[exercises]]
name = "labels3"
path = "exercises/labels/labels3"
topic = "labels"
mode = "manifest"
hint = """
What does YAML make of an unquoted 2? Quote it."""
docs = "https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/#syntax-and-character-set"

[[exercises]]
name = "labels4"
path = "exercises/labels/labels4"
topic = "labels"
mode = "manifest"
hint = """
Which of the two, labels or annotations, can a selector use?"""
docs = "https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/"

[[exercises]]
name = "namespaces1"
path = "exercises/namespaces/namespaces1"
topic = "namespaces"
mode = "manifest"
hint = """
Compare the Pod's namespace with the name of the Namespace object, letter by letter."""
docs = "https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/"

[[exercises]]
name = "deployments1"
path = "exercises/deployments/deployments1"
topic = "deployments"
mode = "manifest"
hint = """
Two fields to change: replicas, and the image tag of the container."""
docs = "https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#scaling-a-deployment"

[[exercises]]
name = "deployments2"
path = "exercises/deployments/deployments2"
topic = "deployments"
mode = "cluster"
timeout = "120s"
hint = """
Which strategy type replaces Pods gradually? Then set how many may be missing and how many may be added."""
docs = "https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy"

[[exercises]]
name = "services1"
path = "exercises/services/services1"
topic = "services"
mode = "cluster"
timeout = "60s"
hint = """
Which port does nginx listen on? targetPort is the port of the Pod, not of the Service."""
docs = "https://kubernetes.io/docs/concepts/services-networking/service/#defining-a-service"

[[exercises]]
name = "config1"
path = "exercises/config/config1"
topic = "config"
mode = "manifest"
hint = """
The Pod asks for LOG_LEVEL. Look at the key in the ConfigMap."""
docs = "https://kubernetes.io/docs/concepts/configuration/configmap/"

[[exercises]]
name = "config2"
path = "exercises/config/config2"
topic = "config"
mode = "manifest"
hint = """
The Pod must name the Secret and the key that the Secret really has."""
docs = "https://kubernetes.io/docs/concepts/configuration/secret/"

[[exercises]]
name = "probes1"
path = "exercises/probes/probes1"
topic = "probes"
mode = "manifest"
hint = """
Which port does nginx listen on, and what does it answer at /?"""
docs = "https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/"

[[exercises]]
name = "resources1"
path = "exercises/resources/resources1"
topic = "resources"
mode = "manifest"
hint = """
Which values would a node of a small cluster have free? CPU in cores or millicores, memory in Mi or Gi."""
docs = "https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/"

[[exercises]]
name = "resources2"
path = "exercises/resources/resources2"
topic = "resources"
mode = "cluster"
timeout = "45s"
hint = """
Each container without requests gets the LimitRange default. How many of those fit in the quota's CPU? Give the container smaller requests."""
docs = "https://kubernetes.io/docs/concepts/policy/resource-quotas/"

[[exercises]]
name = "jobs1"
path = "exercises/jobs/jobs1"
topic = "jobs"
mode = "manifest"
hint = """
Which restartPolicy values does a Job allow?"""
docs = "https://kubernetes.io/docs/concepts/workloads/controllers/job/"

[[exercises]]
name = "jobs2"
path = "exercises/jobs/jobs2"
topic = "jobs"
mode = "manifest"
hint = """
A cron schedule has five fields. How would you write 'every fifth minute' in the first one?"""
docs = "https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/#cron-schedule-syntax"

[[exercises]]
name = "jobs3"
path = "exercises/jobs/jobs3"
topic = "jobs"
mode = "manifest"
hint = """
Which concurrencyPolicy skips a run while the previous one is still going? And how many finished Jobs do you really need to keep?"""
docs = "https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/#concurrency-policy"

[[exercises]]
name = "volumes1"
path = "exercises/volumes/volumes1"
topic = "volumes"
mode = "cluster"
timeout = "60s"
hint = """
Ask the cluster which StorageClasses exist, and read the events of the claim. The class name and the access mode both matter."""
docs = "https://kubernetes.io/docs/concepts/storage/persistent-volumes/#persistentvolumeclaims"

[[exercises]]
name = "statefulsets1"
path = "exercises/statefulsets/statefulsets1"
topic = "statefulsets"
mode = "manifest"
hint = """
A StatefulSet can create a claim per replica. Look for the field that holds claim templates."""
docs = "https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/#volume-claim-templates"

[[exercises]]
name = "statefulsets2"
path = "exercises/statefulsets/statefulsets2"
topic = "statefulsets"
mode = "cluster"
timeout = "60s"
hint = """
Each Pod's subdomain is the StatefulSet's serviceName. Does a Service with that name exist?"""
docs = "https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/#stable-network-id"

[[exercises]]
name = "daemonsets1"
path = "exercises/daemonsets/daemonsets1"
topic = "daemonsets"
mode = "cluster"
timeout = "45s"
requires = ["multinode"]
hint = """
Control-plane nodes are tainted. Which toleration lets a Pod run there?"""
docs = "https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/"

[[exercises]]
name = "scheduling1"
path = "exercises/scheduling/scheduling1"
topic = "scheduling"
mode = "cluster"
timeout = "45s"
requires = ["multinode"]
hint = """
Compare the labels of the nodes (kubectl get nodes --show-labels) with what the Pod asks for. An affinity expression can also say that a label must be absent: DoesNotExist."""
docs = "https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#node-affinity"

[[exercises]]
name = "security1"
path = "exercises/security/security1"
topic = "security"
mode = "manifest"
hint = """
Which numeric user is root? Pick any other one."""
docs = "https://kubernetes.io/docs/tasks/configure-pod-container/security-context/"

[[exercises]]
name = "security2"
path = "exercises/security/security2"
topic = "security"
mode = "manifest"
hint = """
Where does the container write? Mount a writable volume there."""
docs = "https://kubernetes.io/docs/concepts/storage/volumes/#emptydir"

[[exercises]]
name = "security3"
path = "exercises/security/security3"
topic = "security"
mode = "manifest"
hint = """
Drop every capability, then add back only the one that lets a process bind a port below 1024."""
docs = "https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-capabilities-for-a-container"

[[exercises]]
name = "security4"
path = "exercises/security/security4"
topic = "security"
mode = "manifest"
hint = """
Check the four controls of the restricted standard one by one against the Pod."""
docs = "https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted"

[[exercises]]
name = "rbac1"
path = "exercises/rbac/rbac1"
topic = "rbac"
mode = "cluster"
timeout = "30s"
hint = """
A Role grants verbs on resources; a RoleBinding names who gets the Role. Check both the verbs and the subject's name."""
docs = "https://kubernetes.io/docs/reference/access-authn-authz/rbac/#role-and-clusterrole"

[[exercises]]
name = "rbac2"
path = "exercises/rbac/rbac2"
topic = "rbac"
mode = "cluster"
timeout = "30s"
hint = """
Three rules are enough: pods (get, list, watch), pods/log (get), and deployments in the apps group (get, list, patch). Then bind the Role to the ServiceAccount."""
docs = "https://kubernetes.io/docs/reference/access-authn-authz/rbac/#role-example"
[[exercises]]
name = "networkpolicies1"
path = "exercises/networkpolicies/networkpolicies1"
topic = "networkpolicies"
mode = "cluster"
timeout = "45s"
hint = """
Compare the policy's selectors with the labels of the client, and its port with the port nginx listens on."""
docs = "https://kubernetes.io/docs/concepts/services-networking/network-policies/"

[[exercises]]
name = "capstone1"
path = "exercises/capstone/capstone1"
topic = "capstone"
mode = "cluster"
timeout = "60s"
hint = """
Go outside-in: Pod state, then logs and events, then the Service's endpoints, then a request from client. There are four faults."""
docs = "https://kubernetes.io/docs/tasks/debug/debug-application/debug-pods/"

[[exercises]]
name = "troubleshooting1"
path = "exercises/troubleshooting/troubleshooting1"
topic = "troubleshooting"
mode = "fix"
hint = """
Look at the Pods' state, then at what the container prints before it exits (kubectl logs). The message names what is missing. You can add it to the live Deployment with kubectl set env."""
docs = "https://kubernetes.io/docs/tasks/debug/debug-application/debug-pods/"

[[exercises]]
name = "troubleshooting2"
path = "exercises/troubleshooting/troubleshooting2"
topic = "troubleshooting"
mode = "fix"
hint = """
The Pods never start a container. Read the events at the bottom of kubectl describe pod: they name the image and why it cannot be pulled. Fix it on the live Deployment with kubectl set image."""
docs = "https://kubernetes.io/docs/concepts/containers/images/"

[[exercises]]
name = "troubleshooting3"
path = "exercises/troubleshooting/troubleshooting3"
topic = "troubleshooting"
mode = "fix"
hint = """
Compare what the Service selects with the labels the Pods really have (kubectl get pods --show-labels), and look at the EndpointSlices of the Service. kubectl patch changes the Service in place."""
docs = "https://kubernetes.io/docs/tasks/access-application-cluster/connecting-frontend-backend/"

[[exercises]]
name = "troubleshooting4"
path = "exercises/troubleshooting/troubleshooting4"
topic = "troubleshooting"
mode = "fix"
hint = """
The Pod is Pending: read the event on it (kubectl describe pod). It says what the nodes cannot give. kubectl set resources changes the requests of a live Deployment."""
docs = "https://kubernetes.io/docs/concepts/scheduling-eviction/kube-scheduler/"

[[exercises]]
name = "troubleshooting5"
path = "exercises/troubleshooting/troubleshooting5"
topic = "troubleshooting"
mode = "fix"
hint = """
Running is not Ready. The event on the Pod shows what the readiness probe got back; compare it with what nginx really serves. Change the probe, do not remove it."""
docs = "https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/"

[[exercises]]
name = "troubleshooting6"
path = "exercises/troubleshooting/troubleshooting6"
topic = "troubleshooting"
mode = "fix"
hint = """
kubectl auth can-i --as system:serviceaccount:<namespace>:<name> asks what an identity may do. Then read the RoleBinding's subjects with care: names must match exactly."""
docs = "https://kubernetes.io/docs/reference/access-authn-authz/rbac/"

[[exercises]]
name = "troubleshooting7"
path = "exercises/troubleshooting/troubleshooting7"
topic = "troubleshooting"
mode = "fix"
hint = """
No Pods at all: describe the ReplicaSet, not a Pod. Its events say what the quota requires of every Pod. kubectl set resources adds requests to a live Deployment."""
docs = "https://kubernetes.io/docs/concepts/policy/resource-quotas/"

[[exercises]]
name = "troubleshooting8"
path = "exercises/troubleshooting/troubleshooting8"
topic = "troubleshooting"
mode = "fix"
hint = """
Name resolution is traffic too: a Pod asks the cluster DNS (kube-dns, in kube-system, port 53 over UDP and TCP) before it connects. With a policy that selects egress, only what is listed is allowed."""
docs = "https://kubernetes.io/docs/concepts/services-networking/network-policies/"

[[exercises]]
name = "troubleshooting9"
path = "exercises/troubleshooting/troubleshooting9"
topic = "troubleshooting"
mode = "fix"
hint = """
Look at the last state of the container in kubectl describe pod: the reason says who ended it. The limit is a ceiling the kernel enforces; kubectl set resources changes it."""
docs = "https://kubernetes.io/docs/tasks/configure-pod-container/assign-memory-resource/"

[[exercises]]
name = "troubleshooting10"
path = "exercises/troubleshooting/troubleshooting10"
topic = "troubleshooting"
mode = "fix"
hint = """
storageClassName cannot be changed on an existing claim. kubectl get storageclass lists what exists; a claim nothing has written to can be deleted and created again."""
docs = "https://kubernetes.io/docs/concepts/storage/persistent-volumes/"

[[exercises]]
name = "troubleshooting11"
path = "exercises/troubleshooting/troubleshooting11"
topic = "troubleshooting"
mode = "fix"
requires = ["multinode"]
hint = """
The scheduling event lists, per node, why it was rejected. kubectl get nodes shows the real names. Fix the value in the rule with kubectl patch or kubectl edit."""
docs = "https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/"

[[exercises]]
name = "troubleshooting12"
path = "exercises/troubleshooting/troubleshooting12"
topic = "troubleshooting"
mode = "fix"
hint = """
A Deployment keeps its earlier revisions: kubectl rollout history lists them, and kubectl rollout undo goes back to the previous one. The new Pods are stuck, so look at what they are trying to pull."""
docs = "https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#rolling-back-a-deployment"
