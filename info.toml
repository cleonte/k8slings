topic = "troubleshooting"
mode = "fix"
hint = """
There is no shell to exec into, and no tool to look around with. How do you get one next to the container, in the same Pod?"""
docs = "https://kubernetes.io/docs/tasks/debug/debug-application/debug-running-pod/#ephemeral-container"

