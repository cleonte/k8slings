[[exercises]]
name = "jobs1"
path = "exercises/jobs/jobs1"
topic = "jobs"
mode = "manifest"
hint = """
Which restartPolicy values does a Job allow?"""
docs = "https://kubernetes.io/docs/concepts/workloads/controllers/job/"

