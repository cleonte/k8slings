name: build and test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  # Offline mode needs no cluster, so everything here runs on every pull request.
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ "1.26", "1.27", "stable" ]
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}
        cache: true

    - name: Format
      run: test -z "$(gofmt -l .)"

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test -v ./...

  windows:
    name: offline mode on Windows
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-go@v7
      with:
        go-version: "1.26"
        cache: true

    - name: Test
      run: go test ./...

    - name: Smoke test
      shell: bash
      run: scripts/smoke.sh
