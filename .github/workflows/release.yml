name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      # The body of the release is its section of CHANGELOG.md. A tag without a
      # section gets the notes GoReleaser generates from the commits.
      - name: Release notes from CHANGELOG.md
        id: notes
        run: |
          if scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"; then
            echo "flags=--release-notes=$RUNNER_TEMP/release-notes.md" >> "$GITHUB_OUTPUT"
          else
            echo "CHANGELOG.md has no section for $GITHUB_REF_NAME: GoReleaser generates the notes."
          fi

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean ${{ steps.notes.outputs.flags }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A token that can push to the tap (cleonte/homebrew-tap); the GITHUB_TOKEN of
          # a workflow cannot write to another repository. See CONTRIBUTING.md, Releasing.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
