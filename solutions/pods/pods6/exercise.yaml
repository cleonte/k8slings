# pods6: an init container prepares a page that nginx serves.
apiVersion: v1
kind: Pod
metadata:
  name: web
spec:
  initContainers:
    - name: fetch
      image: busybox:1.37
      command: ["sh", "-c", "echo '<h1>hello from init</h1>' > /work/index.html"]
      volumeMounts:
        - name: shared
          mountPath: /work
  containers:
    - name: nginx
      image: nginx:1.27
      volumeMounts:
        - name: shared
          mountPath: /usr/share/nginx/html
  volumes:
    - name: shared
      emptyDir: {}
