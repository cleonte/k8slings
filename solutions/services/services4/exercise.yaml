# services4: a Service whose targetPort names a port the container does not declare.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exporter
spec:
  replicas: 2
  selector:
    matchLabels:
      app: exporter
  template:
    metadata:
      labels:
        app: exporter
    spec:
      containers:
        - name: exporter
          image: nginx:1.27
          ports:
            - name: web
              containerPort: 8080
            - name: metrics
              containerPort: 9100
---
apiVersion: v1
kind: Service
metadata:
  name: exporter-metrics
spec:
  selector:
    app: exporter
  ports:
    - port: 9100
      targetPort: metrics
