# jobs3: a slow sync scheduled far too often.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sync
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: sync
              image: busybox:1.37
              command: ["sh", "-c", "echo syncing; sleep 300"]
