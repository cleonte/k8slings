# jobs6: a Job that can hang for an hour, and is never cleaned up.
apiVersion: batch/v1
kind: Job
metadata:
  name: nightly
spec:
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: task
          image: busybox:1.37
          command: ["sh", "-c", "echo running the nightly task"]
