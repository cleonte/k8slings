# lifecycle4: two init containers that run in the wrong order.
apiVersion: v1
kind: Pod
metadata:
  name: app
spec:
  volumes:
    - name: work
      emptyDir: {}
  initContainers:
    - name: fetch
      image: busybox:1.37
      command: ["sh", "-c", "echo 'hello NAME' > /work/page.tmpl"]
      volumeMounts:
        - name: work
          mountPath: /work
    - name: render
      image: busybox:1.37
      command: ["sh", "-c", "sed 's/NAME/world/' /work/page.tmpl > /work/page.html"]
      volumeMounts:
        - name: work
          mountPath: /work
  containers:
    - name: app
      image: busybox:1.37
      command: ["sh", "-c", "cat /work/page.html && sleep 3600"]
      volumeMounts:
        - name: work
          mountPath: /work
