# probes3: a liveness probe that checks the database.
apiVersion: v1
kind: Pod
metadata:
  name: api
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      readinessProbe:
        httpGet:
          path: /ready-db
          port: 80
        periodSeconds: 5
      livenessProbe:
        httpGet:
          path: /
          port: 80
        periodSeconds: 5
