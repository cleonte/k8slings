# probes2: an application that needs 45 seconds to start, killed after 2.
apiVersion: v1
kind: Pod
metadata:
  name: slow
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      startupProbe:
        httpGet:
          path: /
          port: 80
        periodSeconds: 5
        failureThreshold: 12
      livenessProbe:
        httpGet:
          path: /
          port: 80
        periodSeconds: 2
        failureThreshold: 1
