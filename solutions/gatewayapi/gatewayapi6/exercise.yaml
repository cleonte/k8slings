# gatewayapi6: a route that the listener does not accept.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shop
spec:
  gatewayClassName: traefik
  listeners:
    - name: web
      port: 8000
      protocol: HTTP
      hostname: shop.gatewayapi6.example.test
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: v1
kind: Pod
metadata:
  name: web
  labels: {app: web}
spec:
  terminationGracePeriodSeconds: 0
  containers:
    - name: c
      image: hashicorp/http-echo:1.0.0
      args: ["-text=gatewayapi6 ok", "-listen=:8080"]
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: client
spec:
  terminationGracePeriodSeconds: 0
  containers:
    - name: c
      image: busybox:1.37
      command: [sh, -c, "while :; do sleep 3600; done"]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shop
spec:
  parentRefs:
    - name: shop
      sectionName: web
  hostnames:
    - shop.gatewayapi6.example.test
  rules:
    - backendRefs:
        - name: web
          port: 80
