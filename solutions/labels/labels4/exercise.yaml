# labels4: a Pod owned by a team, and a Service that selects it.
apiVersion: v1
kind: Pod
metadata:
  name: api
  labels:
    app: api
    team: payments
spec:
  containers:
    - name: nginx
      image: nginx:1.27
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
    team: payments
  ports:
    - port: 80
