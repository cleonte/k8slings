# config4: a ConfigMap mounted over all of /etc/nginx.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf
data:
  default.conf: |
    server {
      listen 80;
      location / { return 200 "configured\n"; }
    }
---
apiVersion: v1
kind: Pod
metadata:
  name: site
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      volumeMounts:
        - name: conf
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
  volumes:
    - name: conf
      configMap:
        name: nginx-conf
