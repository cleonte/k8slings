apiVersion: v1
kind: ConfigMap
metadata:
  name: site
data:
  index.html: "k8slings stack ok\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: site
spec:
  replicas: 2
  selector:
    matchLabels:
      app: site
  template:
    metadata:
      labels:
        app: site
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          resources:
            limits:
              memory: 4Mi
          readinessProbe:
            httpGet:
              path: /index.html
              port: 8080
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
      volumes:
        - name: content
          configMap:
            name: site-config
---
apiVersion: v1
kind: Service
metadata:
  name: site
spec:
  selector:
    app: site-web
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: client
spec:
  containers:
    - name: sh
      image: busybox:1.36
      command: ["sleep", "3600"]
