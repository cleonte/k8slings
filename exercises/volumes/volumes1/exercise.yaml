# volumes1: a Pod that saves a note on a claimed volume.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: notes
spec:
  # TODO: this claim never binds. The cluster tells you why.
  accessModes: ["ReadWriteMany"]
  storageClassName: fast
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: writer
spec:
  containers:
    - name: writer
      image: busybox:1.37
      command: ["sh", "-c", "echo saved > /data/note.txt; cat /data/note.txt; sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: notes
