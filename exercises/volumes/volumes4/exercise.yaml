# I AM NOT DONE
# volumes4: a claim whose access mode the default StorageClass cannot provide.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
spec:
  # TODO: can a volume on the disk of one node be shared by many nodes?
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: app
spec:
  containers:
    - name: app
      image: busybox:1.37
      command: ["sleep", "3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: data
