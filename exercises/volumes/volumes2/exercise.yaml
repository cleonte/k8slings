# volumes2: a container that mounts a volume the Pod does not have.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: app
spec:
  containers:
    - name: app
      image: busybox:1.37
      command: ["sleep", "3600"]
      volumeMounts:
        # TODO: the Pod has no volume of this name.
        - name: data
          mountPath: /var/lib/app
  volumes:
    - name: storage
      persistentVolumeClaim:
        claimName: app-data
