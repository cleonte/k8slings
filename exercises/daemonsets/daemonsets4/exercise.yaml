# daemonsets4: a node agent that uses the node itself.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: log-agent
spec:
  selector:
    matchLabels:
      app: log-agent
  template:
    metadata:
      labels:
        app: log-agent
    spec:
      hostNetwork: true
      # TODO: on the host network, how does this Pod resolve cluster names?
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
      containers:
        - name: agent
          image: busybox:1.37
          command: ["sh", "-c", "sleep 3600"]
          volumeMounts:
            - name: varlog
              mountPath: /host/var/log
              # TODO: the agent only reads the logs.
