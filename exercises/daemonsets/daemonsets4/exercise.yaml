# daemonsets4: an agent that skips the control plane.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: collector
spec:
  selector:
    matchLabels:
      app: collector
  template:
    metadata:
      labels:
        app: collector
    spec:
      # TODO: nothing lets this Pod onto the control-plane node.
      containers:
        - name: collector
          image: busybox:1.37
          command: ["sh", "-c", "sleep 3600"]
