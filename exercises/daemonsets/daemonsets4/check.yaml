objects:
  - select: {kind: DaemonSet, name: log-agent}
    assert:
      - expr: "has(object.spec.template.spec.hostNetwork) && object.spec.template.spec.hostNetwork == true"
        message: "The agent runs on the host network: keep hostNetwork."
      - expr: "has(object.spec.template.spec.dnsPolicy) && object.spec.template.spec.dnsPolicy == 'ClusterFirstWithHostNet'"
        message: "On the host network the Pod needs dnsPolicy ClusterFirstWithHostNet to resolve cluster names."
      - expr: "object.spec.template.spec.volumes.exists(v, v.name == 'varlog' && has(v.hostPath) && v.hostPath.path == '/var/log')"
        message: "Keep the hostPath volume of /var/log."
      - expr: "has(object.spec.template.spec.containers[0].volumeMounts) && object.spec.template.spec.containers[0].volumeMounts.exists(m, m.name == 'varlog' && has(m.readOnly) && m.readOnly == true)"
        message: "The agent only reads the logs: mount the hostPath readOnly."
