# I AM NOT DONE
# disruption1: a PodDisruptionBudget that does not let any Pod go.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:1.27
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
spec:
  # TODO: how many of three Pods does a drain have to leave alone?
  minAvailable: 3
  selector:
    matchLabels:
      app: web
