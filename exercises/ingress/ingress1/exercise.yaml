# I AM NOT DONE
# ingress1: a path that matches only itself.
apiVersion: v1
kind: Service
metadata:
  name: shop
spec:
  selector:
    app: shop
  ports:
    - name: http
      port: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /shop
            # TODO: /shop/cart would be a 404.
            pathType: Exact
            backend:
              service:
                name: shop
                port:
                  name: http
