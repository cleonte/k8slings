# I AM NOT DONE
# scheduling1: a batch Deployment that must land on the worker nodes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: batch
spec:
  replicas: 2
  selector:
    matchLabels:
      app: batch
  template:
    metadata:
      labels:
        app: batch
    spec:
      # TODO: no node in this cluster has this label value.
      nodeSelector:
        kubernetes.io/os: windows
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  # TODO: no node has this label either.
                  - key: node-role.kubernetes.io/worker
                    operator: Exists
      containers:
        - name: batch
          image: busybox:1.37
          command: ["sleep", "3600"]
