# I AM NOT DONE
# scheduling5: a PriorityClass above the allowed maximum, and a Pod that names another one.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: high-priority
# TODO: user classes stop at one billion.
value: 3000000000
description: "For Pods that must be scheduled before ordinary ones."
---
apiVersion: v1
kind: Pod
metadata:
  name: payments
spec:
  # TODO: is there a class of this name?
  priorityClassName: high-prio
  containers:
    - name: payments
      image: nginx:1.27
