objects:
  - select: {kind: Service, name: db}
    assert:
      - expr: "has(object.spec.clusterIP) && object.spec.clusterIP == 'None'"
        message: "The governing Service has to be headless: clusterIP None."
      - expr: "object.spec.selector.all(k, objects.exists(s, s.kind == 'StatefulSet' && k in s.spec.template.metadata.labels && s.spec.template.metadata.labels[k] == object.spec.selector[k]))"
        message: "The Service's selector must match the Pods of the StatefulSet."
  - select: {kind: StatefulSet, name: db}
    assert:
      - expr: "object.spec.serviceName == 'db' && object.spec.replicas == 2"
        message: "Keep the StatefulSet: it is the Service that is wrong."
