objects:
  - select: {kind: StatefulSet, name: cache}
    assert:
      - expr: "has(object.spec.persistentVolumeClaimRetentionPolicy)"
        message: "Say what happens to the claims: persistentVolumeClaimRetentionPolicy."
      - expr: "has(object.spec.persistentVolumeClaimRetentionPolicy.whenScaled) && object.spec.persistentVolumeClaimRetentionPolicy.whenScaled == 'Retain'"
        message: "A scale-down must keep the volumes: they hold the warm data and are reused when it scales up."
      - expr: "has(object.spec.persistentVolumeClaimRetentionPolicy.whenDeleted) && object.spec.persistentVolumeClaimRetentionPolicy.whenDeleted == 'Delete'"
        message: "When the StatefulSet is deleted its volumes are worth nothing: they should go with it."
      - expr: "object.spec.replicas == 3 && object.spec.volumeClaimTemplates.size() == 1"
        message: "Keep the StatefulSet as it is: three replicas, one claim template."
