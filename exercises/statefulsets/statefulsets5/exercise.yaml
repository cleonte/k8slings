# I AM NOT DONE
# statefulsets5: a stable name needs a headless Service.
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  # TODO: this Service has one virtual IP, so db-0.db does not resolve.
  type: ClusterIP
  selector:
    app: db
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
spec:
  serviceName: db
  replicas: 2
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: db
          image: nginx:1.27
