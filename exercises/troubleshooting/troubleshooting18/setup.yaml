apiVersion: v1
kind: ConfigMap
metadata:
  name: migrate-script
data:
  migrate.sh: |
    echo "migrating the schema"
    echo "migration complete"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: busybox:1.37
          command: ["sh", "/scripts/migrat.sh"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: migrate-script
