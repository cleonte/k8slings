apiVersion: batch/v1
kind: CronJob
metadata:
  name: cleanup
spec:
  schedule: "* * * * *"
  suspend: true
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: cleanup
              image: busybox:1.37
              command: ["sh", "-c", "echo cleaning up"]
