shipped: "0 of 1 replicas are available"
steps:
  - unchanged: deployment/web
  - assert:
      resource: deployment/web
      expr: "object.spec.replicas == 1"
      message: "Keep one replica: scaling down is not a repair."
    now: true
  - assert:
      resource: deployment/web
      expr: "object.spec.template.spec.containers[0].image == 'nginx:1.27'"
      message: "The image is fine: do not change it. The fault is somewhere else."
    now: true
  - assert:
      resource: deployment/web
      expr: "!has(object.spec.template.spec.nodeName)"
      message: "Do not pin the Pod to a node: let the scheduler place it."
    now: true
  - assert:
      resource: deployment/web
      expr: "object.spec.template.spec.containers.all(c, has(c.resources.requests) && 'cpu' in c.resources.requests)"
      message: "Keep a CPU request: ask for less, but do not stop asking."
    now: true
  - rollout: deployment/web
