# I AM NOT DONE
# deployments3: a rolling update with no room to move.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
spec:
  replicas: 3
  selector:
    matchLabels:
      app: shop
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # TODO: with both at zero the rollout cannot make a single step.
      maxSurge: 0
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: shop
    spec:
      containers:
        - name: shop
          image: nginx:1.27
