apiVersion: v1
kind: Pod
metadata:
  name: web
  labels: {app: web}
spec:
  terminationGracePeriodSeconds: 0
  containers:
    - name: c
      image: hashicorp/http-echo:1.0.0
      args: ["-text=api is up", "-listen=:8080"]
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
spec:
  parentRefs:
    - name: gateway
      namespace: addon-traefik
      sectionName: web
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /gatewayapi8/apii
      backendRefs:
        - name: web
          port: 80
