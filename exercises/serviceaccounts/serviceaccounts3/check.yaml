objects:
  - select: {kind: ServiceAccount, name: builder}
    assert:
      - expr: "has(object.imagePullSecrets) && object.imagePullSecrets.exists(s, s.name == 'regcred')"
        message: "The ServiceAccount does not list the pull secret: put imagePullSecrets there."
      - expr: "objects.filter(o, o.kind == 'Pod').all(p, !has(p.spec.imagePullSecrets))"
        message: "The secret belongs on the ServiceAccount: take it off the Pod, which gets it from the account."
      - expr: "objects.filter(o, o.kind == 'Pod').size() == 2 && objects.filter(o, o.kind == 'Pod').all(p, p.spec.serviceAccountName == 'builder')"
        message: "Both Pods keep running as the ServiceAccount builder."
  - select: {kind: Secret, name: regcred}
    assert:
      - expr: "object.type == 'kubernetes.io/dockerconfigjson'"
        message: "Keep the Secret as it is."
