# serviceaccounts3: pulling from a private registry, for every Pod of an account.
apiVersion: v1
kind: Secret
metadata:
  name: regcred
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{"registry.example.com":{"auth":"dXNlcjpwYXNzd29yZA=="}}}'
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: builder
---
apiVersion: v1
kind: Pod
metadata:
  name: build
spec:
  serviceAccountName: builder
  # TODO: the secret is on this Pod only; `deploy` has none.
  imagePullSecrets:
    - name: regcred
  containers:
    - name: build
      image: registry.example.com/team/build:1.0
---
apiVersion: v1
kind: Pod
metadata:
  name: deploy
spec:
  serviceAccountName: builder
  containers:
    - name: deploy
      image: registry.example.com/team/deploy:1.0
