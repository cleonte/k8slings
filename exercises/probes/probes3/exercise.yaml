# probes3: a liveness probe that checks the database.
apiVersion: v1
kind: Pod
metadata:
  name: api
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      livenessProbe:
        # TODO: when the database is down, this restarts the application.
        httpGet:
          path: /ready-db
          port: 80
        periodSeconds: 5
