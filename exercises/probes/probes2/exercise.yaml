# I AM NOT DONE
# probes2: an application that needs 45 seconds to start, killed after 2.
apiVersion: v1
kind: Pod
metadata:
  name: slow
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      # TODO: nothing protects the application while it is starting.
      livenessProbe:
        httpGet:
          path: /
          port: 80
        periodSeconds: 2
        failureThreshold: 1
