apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  LOGLEVEL: debug
---
apiVersion: v1
kind: Pod
metadata:
  name: app
spec:
  containers:
    - name: main
      image: busybox:1.36
      command: ["sh", "-c", "echo level=$LOG_LEVEL; sleep 3600"]
      env:
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: LOG_LEVEL
