apiVersion: v1
kind: Pod
metadata:
  name: worker
spec:
  terminationGracePeriodSeconds: 0
  volumes:
    - name: state
      emptyDir: {}
  containers:
    - name: app
      image: busybox:1.37
      command:
        - sh
        - -c
        - |
          if [ -f /state/started ]; then echo "second start: working"; while :; do sleep 3600; done; fi
          echo "boom: config file missing"
          touch /state/started
          exit 1
      volumeMounts:
        - name: state
          mountPath: /state
