shipped: "The output is not the one"
query:
  command:
    - expr: "'output' in flags && flags['output'].startsWith('custom-columns=')"
      message: "Use -o custom-columns."
    - expr: "!('no-headers' in flags)"
      message: "Keep the header row."
    - expr: "positional.size() == 1"
      message: "Do not name a Pod."
  variant_steps:
    - assert: {resource: pod/visitor, expr: "object.status.phase == 'Running'", message: "visitor is not Running yet"}
steps:
  - rollout: deployment/web
  - rollout: deployment/db
