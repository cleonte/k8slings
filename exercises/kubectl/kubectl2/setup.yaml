apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
        tier: frontend
    spec:
      terminationGracePeriodSeconds: 0
      containers:
        - name: web
          image: busybox:1.37
          command: [sh, -c, "while :; do sleep 3600; done"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        tier: frontend
        canary: "true"
    spec:
      terminationGracePeriodSeconds: 0
      containers:
        - name: api
