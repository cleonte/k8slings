apiVersion: v1
kind: Pod
metadata:
  name: ok
spec:
  terminationGracePeriodSeconds: 0
  containers:
    - name: c
      image: busybox:1.37
      command: [sh, -c, "while :; do sleep 3600; done"]
---
apiVersion: v1
kind: Pod
metadata:
  name: done
spec:
  terminationGracePeriodSeconds: 0
  restartPolicy: Never
  containers:
    - name: c
      image: busybox:1.37
      command: ["true"]
---
apiVersion: v1
kind: Pod
metadata:
  name: stuck
spec:
  terminationGracePeriodSeconds: 0
  nodeSelector:
    k8slings.io/no-such-node: "yes"
  containers:
    - name: c
      image: busybox:1.37
      command: [sh, -c, "while :; do sleep 3600; done"]
